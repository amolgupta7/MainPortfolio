<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8b90a0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#1a1c1c"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- single, plain page wireframe: simpler than the current site -->
  <rect x="110" y="55" width="180" height="140" rx="4" fill="none" stroke="#414755" stroke-width="1.5"/>
  <rect x="110" y="55" width="180" height="16" rx="4" fill="#282a2b"/>

  <rect x="130" y="90" width="80" height="8" rx="2" fill="#c8c6c5"/>
  <rect x="130" y="106" width="140" height="5" rx="2" fill="#c1c6d7" fill-opacity="0.45"/>
  <rect x="130" y="118" width="140" height="5" rx="2" fill="#c1c6d7" fill-opacity="0.45"/>
  <rect x="130" y="130" width="100" height="5" rx="2" fill="#c1c6d7" fill-opacity="0.45"/>

  <rect x="130" y="150" width="50" height="18" rx="3" fill="none" stroke="#c8c6c5" stroke-width="1.5"/>
</svg>
