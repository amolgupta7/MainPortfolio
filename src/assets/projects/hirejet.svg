<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8b90a0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#1a1c1c"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- three kanban columns: Applied / Interview / Offer -->
  <g fill="none" stroke="#414755" stroke-width="1.5">
    <rect x="40" y="40" width="90" height="180" rx="4"/>
    <rect x="155" y="40" width="90" height="180" rx="4"/>
    <rect x="270" y="40" width="90" height="180" rx="4"/>
  </g>

  <!-- column headers -->
  <g fill="#c1c6d7" fill-opacity="0.6">
    <rect x="52" y="52" width="50" height="6" rx="3"/>
    <rect x="167" y="52" width="50" height="6" rx="3"/>
    <rect x="282" y="52" width="50" height="6" rx="3"/>
  </g>

  <!-- cards, more populated on the left, fewer on the right (funnel) -->
  <g fill="#adc6ff" fill-opacity="0.9">
    <rect x="50" y="72" width="66" height="26" rx="3"/>
    <rect x="50" y="104" width="66" height="26" rx="3"/>
    <rect x="50" y="136" width="66" height="26" rx="3"/>
    <rect x="50" y="168" width="66" height="26" rx="3"/>
  </g>
  <g fill="#adc6ff" fill-opacity="0.65">
    <rect x="165" y="72" width="66" height="26" rx="3"/>
    <rect x="165" y="104" width="66" height="26" rx="3"/>
  </g>
  <g fill="#ffb595" fill-opacity="0.9">
    <rect x="280" y="72" width="66" height="26" rx="3"/>
  </g>

  <!-- flow arrows between columns -->
  <g stroke="#8b90a0" stroke-width="1.5" fill="none">
    <path d="M 130 85 L 155 85" marker-end="url(#arrow)"/>
    <path d="M 245 85 L 270 85" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b90a0"/>
    </marker>
  </defs>
</svg>
