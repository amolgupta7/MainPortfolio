<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8b90a0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#1a1c1c"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- faint moving-average line -->
  <polyline points="30,150 65,140 100,155 135,120 170,130 205,100 240,110 275,80 310,95 345,70"
    fill="none" stroke="#c1c6d7" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- candlesticks: [x, wickTop, wickBottom, bodyTop, bodyBottom, up?] -->
  <g stroke-width="2">
    <line x1="30" y1="120" x2="30" y2="190" stroke="#ffb595"/>
    <rect x="24" y="150" width="12" height="30" fill="#ffb595"/>

    <line x1="65" y1="100" x2="65" y2="170" stroke="#adc6ff"/>
    <rect x="59" y="110" width="12" height="40" fill="#adc6ff"/>

    <line x1="100" y1="130" x2="100" y2="200" stroke="#ffb595"/>
    <rect x="94" y="160" width="12" height="28" fill="#ffb595"/>

    <line x1="135" y1="80" x2="135" y2="150" stroke="#adc6ff"/>
    <rect x="129" y="90" width="12" height="45" fill="#adc6ff"/>

    <line x1="170" y1="95" x2="170" y2="160" stroke="#ffb595"/>
    <rect x="164" y="120" width="12" height="26" fill="#ffb595"/>

    <line x1="205" y1="60" x2="205" y2="135" stroke="#adc6ff"/>
    <rect x="199" y="70" width="12" height="48" fill="#adc6ff"/>

    <line x1="240" y1="75" x2="240" y2="145" stroke="#ffb595"/>
    <rect x="234" y="100" width="12" height="32" fill="#ffb595"/>

    <line x1="275" y1="45" x2="275" y2="115" stroke="#adc6ff"/>
    <rect x="269" y="55" width="12" height="42" fill="#adc6ff"/>

    <line x1="310" y1="60" x2="310" y2="130" stroke="#ffb595"/>
    <rect x="304" y="85" width="12" height="30" fill="#ffb595"/>

    <line x1="345" y1="35" x2="345" y2="105" stroke="#adc6ff"/>
    <rect x="339" y="45" width="12" height="40" fill="#adc6ff"/>
  </g>

  <!-- baseline -->
  <line x1="20" y1="210" x2="380" y2="210" stroke="#414755" stroke-width="1"/>
</svg>
