<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#8b90a0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="250" fill="#1a1c1c"/>
  <rect width="400" height="250" fill="url(#grid)"/>

  <!-- three-layer network graph -->
  <g stroke="#414755" stroke-width="1" stroke-opacity="0.6">
    <!-- input (4) -> hidden (5) -->
    <line x1="90" y1="60" x2="200" y2="45"/>
    <line x1="90" y1="60" x2="200" y2="90"/>
    <line x1="90" y1="60" x2="200" y2="135"/>
    <line x1="90" y1="60" x2="200" y2="180"/>
    <line x1="90" y1="100" x2="200" y2="45"/>
    <line x1="90" y1="100" x2="200" y2="90"/>
    <line x1="90" y1="100" x2="200" y2="135"/>
    <line x1="90" y1="100" x2="200" y2="180"/>
    <line x1="90" y1="145" x2="200" y2="45"/>
    <line x1="90" y1="145" x2="200" y2="90"/>
    <line x1="90" y1="145" x2="200" y2="135"/>
    <line x1="90" y1="145" x2="200" y2="180"/>
    <line x1="90" y1="185" x2="200" y2="45"/>
    <line x1="90" y1="185" x2="200" y2="90"/>
    <line x1="90" y1="185" x2="200" y2="135"/>
    <line x1="90" y1="185" x2="200" y2="180"/>
    <!-- hidden (5) -> output (2) -->
    <line x1="200" y1="45" x2="310" y2="90"/>
    <line x1="200" y1="45" x2="310" y2="160"/>
    <line x1="200" y1="90" x2="310" y2="90"/>
    <line x1="200" y1="90" x2="310" y2="160"/>
    <line x1="200" y1="135" x2="310" y2="90"/>
    <line x1="200" y1="135" x2="310" y2="160"/>
    <line x1="200" y1="180" x2="310" y2="90"/>
    <line x1="200" y1="180" x2="310" y2="160"/>
  </g>

  <g fill="#c8c6c5">
    <circle cx="90" cy="60" r="6"/>
    <circle cx="90" cy="100" r="6"/>
    <circle cx="90" cy="145" r="6"/>
    <circle cx="90" cy="185" r="6"/>
  </g>
  <g fill="#adc6ff">
    <circle cx="200" cy="45" r="6"/>
    <circle cx="200" cy="90" r="6"/>
    <circle cx="200" cy="135" r="6"/>
    <circle cx="200" cy="180" r="6"/>
  </g>
  <g fill="#ffb595">
    <circle cx="310" cy="90" r="7"/>
    <circle cx="310" cy="160" r="7"/>
  </g>
</svg>
