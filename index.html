<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amol Gupta — software engineer & photographer portfolio. Full-stack engineering work, and photography."
    />
    <meta name="theme-color" content="#121414" />
    <title>Amol Gupta | Software Engineer &amp; Photographer</title>
    <!-- Applies the right theme before first paint, avoiding a flash of the
         wrong one. Dark is the CSS default with no attribute set at all
         (see :root[data-theme="light"] in index.css), so this only needs to
         act when the result is "light" — either an explicit saved choice,
         or (with nothing saved yet) the OS/browser's own preference. -->
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var wantsLight =
          stored === "light" ||
          (stored !== "dark" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        if (wantsLight) document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <!-- Restores the real path after 404.html's GitHub Pages SPA redirect
         (see public/404.html) — must run before React Router mounts. -->
    <script>
      (function (l) {
        if (l.search[1] === "p") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .reduce(function (acc, param) {
              var kv = param.split("=");
              acc[kv[0]] = kv[1];
              return acc;
            }, {});
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) +
              (decoded.p ? decodeURIComponent(decoded.p) : "") +
              (decoded.q ? "?" + decodeURIComponent(decoded.q).replace(/~and~/g, "&") : "") +
              l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
